[project]
name = "sem-gan"
version = "0.1.0"
description = "Conditional SliceGAN for 3D microstructure generation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-anyio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["slicegan*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
